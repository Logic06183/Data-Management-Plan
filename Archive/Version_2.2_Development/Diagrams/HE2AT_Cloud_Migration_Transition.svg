<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    HE²AT Center Cloud Migration Transition (v2.2)
  </text>
  
  <!-- Timeline -->
  <line x1="100" y1="80" x2="1100" y2="80" stroke="#333" stroke-width="3"/>
  <text x="300" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Year 1-4</text>
  <text x="600" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Transition (Year 5)</text>
  <text x="900" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Post-Migration</text>
  
  <!-- Before Section -->
  <rect x="50" y="120" width="450" height="720" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" rx="10"/>
  <text x="275" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#495057">
    BEFORE: UCT-Only Infrastructure
  </text>
  
  <!-- UCT Infrastructure -->
  <g id="uct-before">
    <rect x="80" y="180" width="390" height="300" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"/>
    <text x="275" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1976d2">
      University of Cape Town (UCT)
    </text>
    
    <!-- CSAG Infrastructure -->
    <rect x="110" y="230" width="330" height="120" fill="#ffffff" stroke="#1976d2" stroke-width="1" rx="5"/>
    <text x="275" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CSAG Infrastructure</text>
    <text x="275" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• On-premise servers only</text>
    <text x="275" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• UCT firewall protection</text>
    <text x="275" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Jupyter Hub platform</text>
    <text x="275" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Limited scalability</text>
    
    <!-- Data Storage -->
    <rect x="110" y="370" width="150" height="90" fill="#ffffff" stroke="#1976d2" stroke-width="1" rx="5"/>
    <text x="185" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Data Storage</text>
    <text x="185" y="415" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Local Servers</text>
    <text x="185" y="435" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Standard Backup</text>
    <text x="185" y="450" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Manual Disaster Recovery</text>
    
    <!-- Authentication -->
    <rect x="290" y="370" width="150" height="90" fill="#ffffff" stroke="#1976d2" stroke-width="1" rx="5"/>
    <text x="365" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Authentication</text>
    <text x="365" y="415" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">LDAP Only</text>
    <text x="365" y="435" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Basic Access Control</text>
    <text x="365" y="450" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Manual Reporting</text>
  </g>
  
  <!-- Data Recipient Role -->
  <rect x="80" y="500" width="390" height="100" fill="#fff8e1" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="275" y="530" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">
    Data Recipient: UCT Only
  </text>
  <text x="275" y="555" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Single institutional responsibility</text>
  <text x="275" y="575" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Direct DTAs with Data Providers</text>
  <text x="275" y="590" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• All data custody at UCT</text>
  
  <!-- Limitations -->
  <rect x="80" y="620" width="390" height="180" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="8"/>
  <text x="275" y="650" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#c62828">
    Limitations
  </text>
  <text x="275" y="680" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Limited computational resources</text>
  <text x="275" y="700" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Single point of failure for data custody</text>
  <text x="275" y="720" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Manual disaster recovery processes</text>
  <text x="275" y="740" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Seasonal data volume challenges</text>
  <text x="275" y="760" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Limited advanced security monitoring</text>
  <text x="275" y="780" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Basic compliance reporting</text>
  
  <!-- After Section -->
  <rect x="700" y="120" width="450" height="720" fill="#f0f8f0" stroke="#388e3c" stroke-width="2" rx="10"/>
  <text x="925" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    AFTER: Hybrid Cloud Infrastructure
  </text>
  
  <!-- Dual Infrastructure -->
  <g id="dual-after">
    <!-- UCT Component -->
    <rect x="730" y="180" width="170" height="220" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"/>
    <text x="815" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1976d2">
      UCT Infrastructure
    </text>
    <text x="815" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• CSAG/UCT Servers</text>
    <text x="815" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• Jupyter Hub Platform</text>
    <text x="815" y="275" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• Existing Workflows</text>
    <text x="815" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• Research Continuity</text>
    <text x="815" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976d2">Enhanced with:</text>
    <text x="815" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Cloud Integration</text>
    <text x="815" y="355" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• GPU Acceleration</text>
    <text x="815" y="370" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Auto-scaling</text>
    <text x="815" y="385" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Advanced Analytics</text>
    
    <!-- WHC Cloud Component -->
    <rect x="920" y="180" width="200" height="220" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"/>
    <text x="1020" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      WHC Cloud Infrastructure
    </text>
    <text x="1020" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• AES-256 Encryption</text>
    <text x="1020" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• 24/7 SOC Monitoring</text>
    <text x="1020" y="275" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• Advanced Threat Detection</text>
    <text x="1020" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• Auto Backup &amp; Recovery</text>
    <text x="1020" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• Cloud-native Firewall</text>
    <text x="1020" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• Auto-scaling Capabilities</text>
    <text x="1020" y="355" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• Disaster Recovery</text>
    <text x="1020" y="375" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• Compliance Reporting</text>
    <text x="1020" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">• Enhanced Accessibility</text>
  </g>
  
  <!-- Data Recipient Transition -->
  <rect x="730" y="420" width="390" height="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="925" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ef6c00">
    Data Recipient Role Transition
  </text>
  <text x="925" y="475" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• UCT → WHC transition during Year 5</text>
  <text x="925" y="495" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Tripartite Agreements (UCT-WHC-Data Provider)</text>
  <text x="925" y="515" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Data Provider consent &amp; notification required</text>
  <text x="925" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Legal continuity maintained</text>
  
  <!-- Benefits -->
  <rect x="730" y="560" width="390" height="240" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="925" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    Benefits &amp; Enhancements
  </text>
  <text x="925" y="620" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Enhanced scalability for seasonal data volumes</text>
  <text x="925" y="640" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Improved disaster recovery capabilities</text>
  <text x="925" y="660" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Advanced security monitoring (24/7 SOC)</text>
  <text x="925" y="680" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• GPU acceleration for complex analyses</text>
  <text x="925" y="700" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Automated compliance reporting</text>
  <text x="925" y="720" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Enhanced data integrity &amp; backup systems</text>
  <text x="925" y="740" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Improved accessibility for authorized researchers</text>
  <text x="925" y="760" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Dual capability maintains research continuity</text>
  <text x="925" y="780" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• POPIA compliance maintained &amp; enhanced</text>
  
  <!-- Transition Arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="15" markerHeight="15" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 15 4, 0 8" fill="#ff6b35"/>
    </marker>
  </defs>
  
  <path d="M 520 400 Q 600 350 680 400" stroke="#ff6b35" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff6b35">
    Cloud Migration
  </text>
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ff6b35">
    Year 5 Transition
  </text>
  
  <!-- Human Subjects Classification Box -->
  <rect x="520" y="120" width="160" height="200" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="8"/>
  <text x="600" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ad1457">
    NIH Classification
  </text>
  <text x="600" y="165" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ad1457">
    "Human Subjects Study"
  </text>
  <text x="600" y="185" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Additional Requirements:</text>
  <text x="600" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Enhanced consent procedures</text>
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Strengthened participant rights</text>
  <text x="600" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Additional documentation</text>
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Enhanced DAC oversight</text>
  <text x="600" y="265" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Vulnerable population safeguards</text>
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Enhanced training requirements</text>
  <text x="600" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Audit &amp; monitoring requirements</text>
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">• Incident response procedures</text>
  
  <!-- Bottom Key Information -->
  <rect x="50" y="850" width="1100" height="40" fill="#f8f9fa" stroke="#6c757d" stroke-width="1" rx="5"/>
  <text x="75" y="875" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Key Transition Elements:</text>
  <text x="250" y="875" font-family="Arial, sans-serif" font-size="11">Dual capability maintains continuity</text>
  <text x="450" y="875" font-family="Arial, sans-serif" font-size="11">Enhanced security &amp; compliance</text>
  <text x="650" y="875" font-family="Arial, sans-serif" font-size="11">Formal legal transition process</text>
  <text x="850" y="875" font-family="Arial, sans-serif" font-size="11">All POPIA requirements maintained</text>
</svg>