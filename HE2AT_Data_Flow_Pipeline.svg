<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    HE²AT Center Data Flow Pipeline
  </text>
  
  <!-- Background sections -->
  <rect x="50" y="80" width="280" height="680" fill="#e8f4f8" stroke="#2196F3" stroke-width="2" rx="5"/>
  <rect x="350" y="80" width="280" height="680" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="5"/>
  <rect x="650" y="80" width="280" height="680" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2" rx="5"/>
  <rect x="950" y="80" width="200" height="680" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  
  <!-- Section Headers -->
  <text x="190" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565C0">
    Data Sources
  </text>
  <text x="490" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#E65100">
    Processing
  </text>
  <text x="790" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#6A1B9A">
    Access Levels
  </text>
  <text x="1050" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2E7D32">
    Output
  </text>
  
  <!-- Data Sources -->
  <g id="health-data">
    <rect x="70" y="140" width="240" height="120" fill="#ffffff" stroke="#1976D2" stroke-width="2" rx="5"/>
    <text x="190" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Health Data</text>
    <text x="190" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Clinical Trials</text>
    <text x="190" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Cohort Studies</text>
    <text x="190" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Individual Participant Data</text>
  </g>
  
  <g id="climate-data">
    <rect x="70" y="280" width="240" height="120" fill="#ffffff" stroke="#1976D2" stroke-width="2" rx="5"/>
    <text x="190" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Climate/Weather Data</text>
    <text x="190" y="335" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Weather Stations</text>
    <text x="190" y="355" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Satellite Observations</text>
    <text x="190" y="375" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Re-analysis Data</text>
  </g>
  
  <g id="socio-economic-data">
    <rect x="70" y="420" width="240" height="120" fill="#ffffff" stroke="#1976D2" stroke-width="2" rx="5"/>
    <text x="190" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Socio-Economic Data</text>
    <text x="190" y="475" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Census Data</text>
    <text x="190" y="495" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Household Surveys</text>
    <text x="190" y="515" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• GCRO Quality of Life</text>
  </g>
  
  <g id="remote-sensing">
    <rect x="70" y="560" width="240" height="120" fill="#ffffff" stroke="#1976D2" stroke-width="2" rx="5"/>
    <text x="190" y="590" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Remote Sensing Data</text>
    <text x="190" y="615" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Land Surface Temp</text>
    <text x="190" y="635" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• NDVI / Vegetation</text>
    <text x="190" y="655" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">• Urban Heat Islands</text>
  </g>
  
  <!-- Processing Steps -->
  <g id="preprocessing">
    <rect x="370" y="140" width="240" height="80" fill="#ffffff" stroke="#F57C00" stroke-width="2" rx="5"/>
    <text x="490" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Pre-Processing</text>
    <text x="490" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Core Data Team</text>
    <text x="490" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Initial Cleaning &amp; Validation</text>
  </g>
  
  <g id="harmonization">
    <rect x="370" y="240" width="240" height="80" fill="#ffffff" stroke="#F57C00" stroke-width="2" rx="5"/>
    <text x="490" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Harmonisation</text>
    <text x="490" y="290" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Common Variable Names</text>
    <text x="490" y="310" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Standardized Units &amp; Formats</text>
  </g>
  
  <g id="integration">
    <rect x="370" y="340" width="240" height="80" fill="#ffffff" stroke="#F57C00" stroke-width="2" rx="5"/>
    <text x="490" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Integration</text>
    <text x="490" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Dataset Alignment</text>
    <text x="490" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Spatial-Temporal Matching</text>
  </g>
  
  <g id="deidentification">
    <rect x="370" y="440" width="240" height="80" fill="#ffffff" stroke="#F57C00" stroke-width="2" rx="5"/>
    <text x="490" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">De-identification</text>
    <text x="490" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Remove Direct Identifiers</text>
    <text x="490" y="510" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Protect Participant Privacy</text>
  </g>
  
  <g id="database">
    <rect x="370" y="540" width="240" height="80" fill="#ffffff" stroke="#F57C00" stroke-width="2" rx="5"/>
    <text x="490" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Database Population</text>
    <text x="490" y="590" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Cloud &amp; UCT Infrastructure</text>
    <text x="490" y="610" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Automated Backup Systems</text>
  </g>
  
  <!-- Access Levels -->
  <g id="original-data">
    <rect x="670" y="140" width="240" height="100" fill="#ffffff" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="790" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Original Study Data</text>
    <text x="790" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d32f2f">Restricted Access</text>
    <text x="790" y="210" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Core Data Team Only</text>
    <text x="790" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Contains Personal Identifiers</text>
  </g>
  
  <g id="consortium-data">
    <rect x="670" y="260" width="240" height="100" fill="#ffffff" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="790" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Consortium Shared Data</text>
    <text x="790" y="310" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f57c00">Consortium Access</text>
    <text x="790" y="330" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">HE²AT Partners Only</text>
    <text x="790" y="350" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Limited Indirect Identifiers</text>
  </g>
  
  <g id="deidentified-data">
    <rect x="670" y="380" width="240" height="100" fill="#ffffff" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="790" y="405" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RP1/RP2 De-identified</text>
    <text x="790" y="430" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1976d2">Controlled Access</text>
    <text x="790" y="450" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">DAC Approved Researchers</text>
    <text x="790" y="470" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">No Personal Identifiers</text>
  </g>
  
  <g id="inferential-data">
    <rect x="670" y="500" width="240" height="100" fill="#ffffff" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="790" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Inferential Data</text>
    <text x="790" y="550" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#388e3c">Open Access</text>
    <text x="790" y="570" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Aggregated Results</text>
    <text x="790" y="590" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Publicly Available</text>
  </g>
  
  <!-- Output -->
  <g id="analysis">
    <rect x="970" y="200" width="160" height="80" fill="#ffffff" stroke="#388E3C" stroke-width="2" rx="5"/>
    <text x="1050" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Analysis</text>
    <text x="1050" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Jupyter Hub</text>
    <text x="1050" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">GPU Acceleration</text>
  </g>
  
  <g id="research">
    <rect x="970" y="300" width="160" height="80" fill="#ffffff" stroke="#388E3C" stroke-width="2" rx="5"/>
    <text x="1050" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Research</text>
    <text x="1050" y="350" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Publications</text>
    <text x="1050" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Heat-Health Models</text>
  </g>
  
  <g id="ews">
    <rect x="970" y="400" width="160" height="80" fill="#ffffff" stroke="#388E3C" stroke-width="2" rx="5"/>
    <text x="1050" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Early Warning</text>
    <text x="1050" y="450" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Heat Alerts</text>
    <text x="1050" y="470" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Risk Maps</text>
  </g>
  
  <g id="capacity">
    <rect x="970" y="500" width="160" height="80" fill="#ffffff" stroke="#388E3C" stroke-width="2" rx="5"/>
    <text x="1050" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Capacity Building</text>
    <text x="1050" y="550" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Training</text>
    <text x="1050" y="570" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Knowledge Transfer</text>
  </g>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Flow arrows -->
  <path d="M 310 200 L 365 180" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 310 340 L 365 180" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 310 480 L 365 180" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 310 620 L 365 180" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <path d="M 490 220 L 490 235" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 490 320 L 490 335" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 490 420 L 490 435" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 490 520 L 490 535" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <path d="M 615 180 L 665 190" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 615 280 L 665 310" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 615 380 L 665 430" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 615 480 L 665 550" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <path d="M 915 310 L 965 240" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 915 430 L 965 340" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 915 550 L 965 440" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 915 550 L 965 540" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="700" width="1100" height="50" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <text x="70" y="730" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Security Levels:</text>
    <circle cx="200" cy="725" r="5" fill="#d32f2f"/>
    <text x="210" y="730" font-family="Arial, sans-serif" font-size="12">Restricted</text>
    <circle cx="300" cy="725" r="5" fill="#f57c00"/>
    <text x="310" y="730" font-family="Arial, sans-serif" font-size="12">Consortium</text>
    <circle cx="400" cy="725" r="5" fill="#1976d2"/>
    <text x="410" y="730" font-family="Arial, sans-serif" font-size="12">Controlled</text>
    <circle cx="500" cy="725" r="5" fill="#388e3c"/>
    <text x="510" y="730" font-family="Arial, sans-serif" font-size="12">Open Access</text>
    
    <text x="650" y="730" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Infrastructure:</text>
    <text x="750" y="730" font-family="Arial, sans-serif" font-size="12">UCT Servers + WHC Cloud (AES-256 Encrypted)</text>
  </g>
</svg>